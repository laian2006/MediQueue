openapi: "3.0.3"
info:
  title: "MediQueue API — hợp đồng triển khai"
  version: "1.0.0"
  description: "Thiết kế phiên bản 1.0 ban hành ngày 01/11/2026, áp dụng triển khai trong nhóm. Tài liệu không xác nhận API đã được lập trình. Quy ước UUID dạng chuỗi, JSON camelCase, thời gian UTC ISO 8601. Áp dụng cookie/server session và T=60 giây theo thiết kế chung."
servers:
  -
    url: "/api/v1"
    description: "Tiền tố API chung"
x-design-status: "ISSUED_FOR_IMPLEMENTATION"
x-no-show-timeout-seconds: 60
security:
  -
    sessionCookie: []
paths:
  "/auth/login":
    post:
      summary: "Đăng nhập tài khoản giả lập đã được cấp"
      operationId: "post_auth_login"
      tags:
        - "auth"
      x-owner: "Hưng"
      x-wbs: "1.4"
      x-access: "PUBLIC"
      responses:
        "200":
          description: "Thành công"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  data:
                    "$ref": "#/components/schemas/LoginData"
                required:
                  - "data"
        "400":
          description: "Đầu vào không hợp lệ"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Chưa xác thực"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Không có quyền"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Lỗi hệ thống"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      description: "Thiết kế phiên bản 1.0 ban hành ngày 01/11/2026, áp dụng triển khai trong nhóm. Tài liệu không xác nhận API đã được lập trình. Chủ trì: Hưng; WBS 1.4. Không cần đăng nhập."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginInput"
