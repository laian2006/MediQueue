components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "mediqueue.sid"
      description: "Cookie HttpOnly chứa định danh phiên đăng nhập phía server; Hưng/Trực triển khai store PostgreSQL theo thiết kế chung."
  schemas:
    User:
      type: "object"
      additionalProperties: false
      properties:
        userId:
          type: "string"
          format: "uuid"
        displayName:
          type: "string"
        role:
          type: "string"
          enum:
            - "REPRESENTATIVE"
            - "STAFF"
      required:
        - "userId"
        - "displayName"
        - "role"
    Patient:
      type: "object"
      additionalProperties: false
      properties:
        patientId:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        displayName:
          type: "string"
      required:
        - "patientId"
        - "code"
        - "displayName"
    Session:
      type: "object"
      additionalProperties: false
      properties:
        sessionId:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum:
            - "OPEN"
            - "STOPPED"
            - "CLOSED"
        lastIssuedNumber:
          type: "integer"
          minimum: 0
        openedAt:
          type: "string"
          format: "date-time"
        stoppedAt:
          type: "string"
          format: "date-time"
          nullable: true
        closedAt:
          type: "string"
          format: "date-time"
          nullable: true
      required:
        - "sessionId"
        - "status"
        - "lastIssuedNumber"
        - "openedAt"
        - "stoppedAt"
        - "closedAt"
    Ticket:
      type: "object"
      additionalProperties: false
      properties:
        ticketId:
          type: "string"
          format: "uuid"
        sessionId:
          type: "string"
          format: "uuid"
        patientId:
          type: "string"
          format: "uuid"
        number:
          type: "integer"
          minimum: 1
        status:
          type: "string"
          enum:
            - "WAITING"
            - "CALLED"
            - "REGISTERING"
            - "COMPLETED"
            - "CANCELLED"
            - "NO_SHOW"
        lastCalledAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
        - "ticketId"
        - "sessionId"
        - "patientId"
        - "number"
        - "status"
        - "lastCalledAt"
        - "createdAt"
        - "updatedAt"
    TicketView:
      type: "object"
      additionalProperties: false
      properties:
        ticket:
          "$ref": "#/components/schemas/Ticket"
        waitingAhead:
          type: "integer"
          minimum: 0
          nullable: true
      required:
        - "ticket"
