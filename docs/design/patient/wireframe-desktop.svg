<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="752" viewBox="0 0 1080 752" role="img" aria-label="Wireframe giao diện người bệnh MediQueue"><rect width="100%" height="100%" fill="#f6f6f6"/><g font-family="Arial, sans-serif" fill="#242b30"><rect x="24" y="24" width="1032" height="70" rx="8" fill="white" stroke="#89939b"/><text x="48" y="66" font-size="22" font-weight="700">MediQueue  |  Đăng ký ngoại trú</text><text x="740" y="66" font-size="14" font-weight="400">Bản xem thử · Dữ liệu mô phỏng</text><text x="48" y="145" font-size="28" font-weight="700">Lấy số và theo dõi lượt đăng ký</text><text x="48" y="180" font-size="16" font-weight="400">Chọn đúng hồ sơ để xem số thứ tự và trạng thái tại quầy.</text><rect x="48" y="220" width="440" height="410" rx="8" fill="white" stroke="#89939b"/><text x="72" y="256" font-size="20" font-weight="700">Bước 1 · Chọn hồ sơ người bệnh</text><text x="72" y="292" font-size="16" font-weight="400">Hồ sơ được cấp quyền đại diện</text><rect x="72" y="312" width="392" height="48" rx="8" fill="white" stroke="#89939b"/><text x="88" y="343" font-size="16" font-weight="400">P001 — Người bệnh mô phỏng 01</text><text x="72" y="401" font-size="16" font-weight="700">Đang thao tác: Người bệnh mô phỏng 01</text><text x="72" y="432" font-size="16" font-weight="400">Mã hồ sơ: P001</text><text x="72" y="498" font-size="16" font-weight="700">Phiên đăng ký</text><text x="72" y="531" font-size="16" font-weight="400">Đang nhận số</text><text x="72" y="571" font-size="14" font-weight="400">Chưa có phiếu: hiển thị nút lấy số.</text><rect x="512" y="220" width="520" height="410" rx="8" fill="white" stroke="#89939b"/><text x="536" y="256" font-size="20" font-weight="700">Bước 2 · Phiếu đăng ký</text><text x="681" y="304" font-size="16" font-weight="400">Số thứ tự của bạn</text><text x="731" y="386" font-size="64" font-weight="700">12</text><text x="713" y="426" font-size="18" font-weight="700">Đang chờ</text><text x="558" y="470" font-size="16" font-weight="400">Vui lòng theo dõi và chờ được gọi đến quầy.</text><text x="536" y="532" font-size="16" font-weight="400">Hồ sơ: P001 — Người bệnh mô phỏng 01</text><text x="536" y="576" font-size="16" font-weight="400">Số người đang chờ phía trước: 2</text><text x="48" y="678" font-size="14" font-weight="400">Trạng thái khác: đang tải · không có hồ sơ · chưa có phiên · CALLED · lỗi</text><text x="48" y="710" font-size="14" font-weight="400">Đăng nhập do Hưng làm → chọn hồ sơ → xem phiếu / lấy số (mock).</text></g></svg>
