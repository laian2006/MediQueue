<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-label="Wireframe giao diện vận hành quầy MediQueue"><rect width="100%" height="100%" fill="#f6f6f6"/><g font-family="Arial, sans-serif" fill="#242b30"><rect x="24" y="24" width="1032" height="70" rx="8" fill="white" stroke="#89939b"/><text x="48" y="66" font-size="22" font-weight="700">MediQueue  |  Vận hành quầy đăng ký</text><text x="800" y="66" font-size="14">Bản xem thử · Dữ liệu mô phỏng</text><text x="48" y="142" font-size="28" font-weight="700">Vận hành quầy</text><rect x="48" y="164" width="984" height="64" rx="8" fill="white" stroke="#89939b" stroke-dasharray="6 4"/><text x="72" y="202" font-size="16" font-weight="700">Khu vực phiên: import SessionPanel của An (1.2)</text><text x="560" y="202" font-size="14">Trung không viết lại mở / ngừng / đóng phiên.</text><rect x="48" y="244" width="984" height="48" rx="8" fill="white" stroke="#89939b"/><text x="72" y="274" font-size="14">Vùng thông báo: thành công sau xác nhận API · từ chối 409 · chưa có xác nhận · dữ liệu có thể đã cũ</text><rect x="48" y="308" width="520" height="384" rx="8" fill="white" stroke="#242b30" stroke-width="2"/><text x="72" y="346" font-size="20" font-weight="700">Lượt hiện tại</text><rect x="448" y="326" width="96" height="30" rx="15" fill="white" stroke="#89939b"/><text x="464" y="346" font-size="14" font-weight="700">Quầy bận</text><text x="272" y="432" font-size="72" font-weight="700">4</text><rect x="256" y="452" width="88" height="30" rx="15" fill="white" stroke="#89939b"/><text x="270" y="472" font-size="14" font-weight="700">Đang gọi</text><text x="164" y="512" font-size="16">Đã gọi số này, chờ người bệnh đến quầy.</text><line x1="72" y1="532" x2="544" y2="532" stroke="#89939b"/><text x="72" y="560" font-size="16">Gọi gần nhất</text><text x="476" y="560" font-size="16" font-weight="700">09:03:30</text><rect x="72" y="584" width="472" height="48" rx="8" fill="#e3e3e3" stroke="#89939b"/><text x="236" y="614" font-size="16" font-weight="700">Gọi số tiếp theo (khóa)</text><text x="72" y="664" font-size="14">Quầy đang bận. Cần xử lý xong lượt hiện tại trước khi gọi tiếp.</text><rect x="592" y="308" width="440" height="384" rx="8" fill="white" stroke="#89939b"/><text x="616" y="346" font-size="20" font-weight="700">Hàng chờ</text><text x="896" y="346" font-size="14">3 số đang chờ</text><line x1="616" y1="366" x2="1008" y2="366" stroke="#89939b"/><text x="616" y="402" font-size="22" font-weight="700">5</text><text x="864" y="402" font-size="14">Lấy số lúc 08:25:00</text><line x1="616" y1="422" x2="1008" y2="422" stroke="#89939b"/><text x="616" y="458" font-size="22" font-weight="700">6</text><text x="864" y="458" font-size="14">Lấy số lúc 08:30:00</text><line x1="616" y1="478" x2="1008" y2="478" stroke="#89939b"/><text x="616" y="514" font-size="22" font-weight="700">7</text><text x="864" y="514" font-size="14">Lấy số lúc 08:35:00</text><text x="616" y="600" font-size="14">Thứ tự theo number tăng từ máy chủ.</text><text x="616" y="624" font-size="14">Không hiện UUID hoặc số giả khi hàng rỗng.</text><text x="48" y="730" font-size="14">Trạng thái khác: đang tải · quầy rảnh · REGISTERING · hàng rỗng · chưa có phiên · STOPPED · lỗi tải · dữ liệu cũ</text><text x="48" y="758" font-size="14">Sprint 2 thêm gọi lại, bắt đầu, hoàn tất, ghi vắng vào panel Lượt hiện tại (2.16, 2.17).</text></g></svg>
